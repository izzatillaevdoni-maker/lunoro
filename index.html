
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUNORO — Парфюмерия</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Arial,sans-serif}
header{padding:25px 18px;border-bottom:1px solid #eee;text-align:center}
.logo{font-size:30px;letter-spacing:7px;font-weight:600}
.sub{font-size:10px;letter-spacing:4px;margin-top:7px;color:#777}
.hero{text-align:center;padding:55px 20px;background:#f7f7f7}
.hero h1{font-size:29px;letter-spacing:3px;font-weight:400}
.hero p{color:#666;font-size:14px}
main{padding:25px 16px;max-width:900px;margin:auto}
h2{text-align:center;font-size:20px;letter-spacing:3px;font-weight:400}
.products{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.product{border:1px solid #eee;padding:10px}
.product img{width:100%;height:190px;object-fit:cover;background:#f4f4f4}
.product h3{font-size:14px;margin:12px 0 6px}
.price{font-weight:bold;margin:8px 0}
button{background:#111;color:white;border:0;padding:12px;width:100%;cursor:pointer}
#cart{margin-top:35px;padding:20px;background:#f7f7f7}
#cart p{font-size:14px}
footer{text-align:center;padding:35px;color:#777;font-size:12px}
@media(min-width:650px){.products{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<div class="logo">LUNORO</div>
<div class="sub">THE ART OF FRAGRANCE</div>
</header>

<section class="hero">
<h1>НАЙДИ СВОЙ АРОМАТ</h1>
<p>Коллекция ароматов для особенных моментов</p>
</section>

<main>
<h2>КАТАЛОГ</h2>
<div class="products" id="products"></div>

<section id="cart">
<h2>ВАШ ЗАКАЗ</h2>
<div id="items">Корзина пока пуста</div>
<p id="total">Итого: 0 ₸</p>
<button onclick="order()">ЗАКАЗАТЬ ЧЕРЕЗ WHATSAPP</button>
</section>
</main>

<footer>
LUNORO · PARFUM<br><br>
© 2026 LUNORO
</footer>

<script>
const phone="77073137979";

const products=[
{name:"Мужской аромат №1",price:15000,image:"https://placehold.co/500x600?text=LUNORO"},
{name:"Мужской аромат №2",price:18000,image:"https://placehold.co/500x600?text=LUNORO"},
{name:"Женский аромат №1",price:15000,image:"https://placehold.co/500x600?text=LUNORO"},
{name:"Женский аромат №2",price:18000,image:"https://placehold.co/500x600?text=LUNORO"}
];

let cart=[];

function render(){
document.getElementById("products").innerHTML=products.map((p,i)=>`
<div class="product">
<img src="${p.image}" alt="${p.name}">
<h3>${p.name}</h3>
<div class="price">${p.price.toLocaleString("ru-RU")} ₸</div>
<button onclick="add(${i})">В КОРЗИНУ</button>
</div>`).join("");
}

function add(i){
cart.push(products[i]);
updateCart();
}

function updateCart(){
document.getElementById("items").innerHTML=cart.length?
cart.map(p=>`<p>${p.name} — ${p.price.toLocaleString("ru-RU")} ₸</p>`).join("")
:"Корзина пока пуста";
let sum=cart.reduce((a,p)=>a+p.price,0);
document.getElementById("total").textContent="Итого: "+sum.toLocaleString("ru-RU")+" ₸";
}

function order(){
if(!cart.length){alert("Сначала добавьте товар в корзину");return}
let sum=cart.reduce((a,p)=>a+p.price,0);
let message="Здравствуйте! Хочу заказать:%0A"+
cart.map(p=>p.name+" — "+p.price+" ₸").join("%0A")+
"%0AИтого: "+sum+" ₸";
window.open("https://wa.me/"+phone+"?text="+message,"_blank");
}

render();
</script>
</body>
</html>
